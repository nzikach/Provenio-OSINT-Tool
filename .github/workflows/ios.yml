name: Build Provenio for iPhone (IPA)

# Неподписанный IPA для iPhone/iPad (устанавливается через AltStore, SideStore,
# Sideloadly или TrollStore — они подписывают его вашим Apple ID).
# Собирается на macOS: BeeWare Briefcase создаёт Xcode-проект, xcodebuild собирает
# приложение для устройства без подписи, затем .app упаковывается в Payload/ -> .ipa.
#
# Mac-машин arm64 у GitHub часто не хватает (задание ждёт 15 минут и падает с «not acquired by Runner»),
# поэтому собираем сразу на двух типах Mac: arm64 и Intel — в релиз попадёт тот, что соберётся.
# Дособрать IPA в уже выпущенный релиз: git tag ipa-v2.4.0 && git push origin ipa-v2.4.0
on:
  push:
    branches: [main]
    tags: ["v*", "ipa-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version

      - name: Prepare sources and icons
        run: python ios/prepare.py

      - name: Install Briefcase
        run: python -m pip install "briefcase==0.4.7"

      - name: Create Xcode project
        working-directory: ios
        run: |
          set -o pipefail
          briefcase create iOS --no-input 2>&1 | tee ../create.log

      - name: Build app for device (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          PROJ=$(find build -maxdepth 4 -name "*.xcodeproj" | head -1)
          echo "Project: $PROJ"
          xcodebuild -list -project "$PROJ" | tee ../schemes.log
          SCHEME=$(xcodebuild -list -json -project "$PROJ" | python3 -c "import sys,json;print(json.load(sys.stdin)['project']['schemes'][0])")
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../xcode.log | grep -E "error|warning: .*Python|BUILD" || true
          test -d "$(find dd/Build/Products -maxdepth 2 -name '*.app' | head -1)"

      - name: Package IPA
        run: |
          APP=$(find ios/dd/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "App: $APP"; du -sh "$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          V=$(grep -oE 'APP_VERSION = "[^"]+"' provenio.py | cut -d'"' -f2)
          (cd out && zip -qry "Provenio-$V.ipa" Payload && rm -rf Payload)
          (cd out && shasum -a 256 "Provenio-$V.ipa" > "Provenio-$V.ipa.sha256")
          ls -la out

      - name: Report failure details
        if: failure()
        run: |
          for f in create.log xcode.log; do
            if [ -f "$f" ]; then
              msg=$( (grep -nE "error|Error|ERROR|failed|Failed|FAILED|Traceback|exception" "$f" | tail -30; echo ----; tail -25 "$f") \
                | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f::$msg"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Provenio-ipa-${{ matrix.os }}
          path: out/*

      - name: Release tag
        id: rel
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          T="${GITHUB_REF#refs/tags/}"; T="${T#ipa-}"
          V=$(grep -oE 'APP_VERSION = "[^"]+"' provenio.py | cut -d'"' -f2)
          [ "$T" = "v$V" ] || { echo "::error::Тег $T не совпадает с версией $V"; exit 1; }
          echo "tag=$T" >> "$GITHUB_OUTPUT"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: out/*
          overwrite_files: true
