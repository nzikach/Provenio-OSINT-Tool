# Provenio для iPhone / iPad (BeeWare Briefcase + Toga).
# Сборка IPA — на macOS (GitHub Actions: .github/workflows/ios.yml):
#   python ios/prepare.py && cd ios && briefcase create iOS && xcodebuild ...
# Ядро Provenio (Python) работает прямо на телефоне, интерфейс — тот же, во встроенном WebView.
[tool.briefcase]
project_name = "Provenio"
bundle = "io.github.nzikach"
version = "2.2.0"
url = "https://github.com/nzikach/Provenio-OSINT-Tool"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
author = "nzikach"
author_email = "360226776+nzikach@users.noreply.github.com"

[tool.briefcase.app.provenio_app]
formal_name = "Provenio"
description = "OSINT с доказательной базой"
long_description = """Кейсы и архив источников с SHA-256, 55+ OSINT-инструментов, граф связей,
глобус с живыми данными, IP-радар, проверка утечек и фишинга."""
icon = "icons/provenio"
sources = [
    "src/provenio_app",
]
requires = [
    "certifi",
]

[tool.briefcase.app.provenio_app.iOS]
requires = [
    "toga-iOS~=0.5.0",
    "std-nslog~=2.0.0",
]
splash_background_color = "#060509"
min_os_version = "15.0"

[tool.briefcase.app.provenio_app.iOS.info]
# экспорт (отчёты, ZIP, CSV) появляется в «Файлы» → На iPhone → Provenio
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
UIStatusBarStyle = "UIStatusBarStyleLightContent"
UIUserInterfaceStyle = "Dark"
# интерфейс открывается с локального сервера 127.0.0.1
NSAppTransportSecurity = {NSAllowsLocalNetworking = true}
