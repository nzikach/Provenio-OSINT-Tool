name: Build Provenio.exe

# Сборка на каждый push в main (exe доступен в Artifacts запуска)
# и выпуск релиза с exe при пуше тега вида v2.0.0.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv
        run: python -m venv .venv

      - name: Build (tests + PyInstaller)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -SourceBootloader

      - name: SHA-256
        shell: powershell
        run: |
          $h = (Get-FileHash dist\Provenio.exe -Algorithm SHA256).Hash
          "$h  Provenio.exe" | Out-File -Encoding ascii dist\Provenio.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Provenio-exe
          path: |
            dist/Provenio.exe
            dist/Provenio.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Provenio.exe
            dist/Provenio.exe.sha256
          generate_release_notes: true
